name: Security gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/security_scan.py
      - run: python -m pip_audit -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m compileall -q choque cogs command_center scripts main.py
      - run: python main.py --check
        env:
          DATABASE_PATH: data/ci-check.db
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python scripts/generate_sbom.py
      - uses: actions/upload-artifact@v6
        with:
          name: security-sbom
          path: artifacts/security/sbom.spdx.json
          if-no-files-found: error
