name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          # Private repositories without GitHub Advanced Security cannot publish
          # SARIF to the code-scanning dashboard. The analysis still runs in full
          # and its report is retained below as a workflow artifact.
          upload: false
          upload-database: false
          output: results
      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: results/*.sarif
          if-no-files-found: error
